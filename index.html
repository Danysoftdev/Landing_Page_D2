<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>D2 Mall - Upcoming Opening </title>
    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script>
</head>
<body>
    <header>
        <div class="header-content">
            <a href="#" style="color: white; text-decoration: none;">English ▼</a>
        </div>
    </header>
    
    <div class="main-container">
        <div class="announcement-section">
            <div class="countdown-container">
                <p class="countdown-title">¡Countdown to Opening!</p>
                <h1 class="main-title">¡Only left!</h1>
                
                <div class="logo">D2</div>
                
                <div class="countdown">
                    <div class="countdown-item">
                        <span class="countdown-value" id="days">03</span>
                        <span class="countdown-label">days</span>
                    </div>
                    <div class="countdown-item">
                        <span class="countdown-value" id="hours">23</span>
                        <span class="countdown-label">hours</span>
                    </div>
                    <div class="countdown-item">
                        <span class="countdown-value" id="minutes">19</span>
                        <span class="countdown-label">minutes</span>
                    </div>
                    <div class="countdown-item">
                        <span class="countdown-value" id="seconds">56</span>
                        <span class="countdown-label">seconds</span>
                    </div>
                </div>
            </div>
            <div class="mall-image">
                <img src="images/mall_image.jpeg">
            </div>
        </div>
        
        <div class="categories-section">
            <h2 class="categories-title">Get to know our categories</h2>
            
            <div class="categories-grid">
                <div class="category-card">
                    <div class="category-image">
                        <img src="images/Clothing_accesories.jpeg" alt="Clothing and accesories">
                    </div>
                    <p class="category-name">Clothing and accesories</p>
                </div>
                <div class="category-card">
                    <div class="category-image">
                        <img src="images/Technology_electronics.jpeg" alt="Electronics and technology">
                    </div>
                    <p class="category-name">Electronics and technology</p>
                </div>
                <div class="category-card">
                    <div class="category-image">
                        <img src="images/home_decoration.jpeg" alt="Home and decoration">
                    </div>
                    <p class="category-name">Home and decoration</p>
                </div>
                <div class="category-card">
                    <div class="category-image">
                        <img src="images/sports_outdoors.jpeg" alt="Sports">
                    </div>
                    <p class="category-name">Sports</p>
                </div>
            </div>
            
            <div class="categories-grid-row2">
                <div class="category-card">
                    <div class="category-image">
                        <img src="images/health_beauty.jpeg" alt="Salud y belleza">
                    </div>
                    <p class="category-name">Health and beauty</p>
                </div>
                <div class="category-card">
                    <div class="category-image">
                        <img src="images/toys_entertainment.jpeg" alt="Toys and entertainment">
                    </div>
                    <p class="category-name">Toys and entertainment</p>
                </div>
                <div class="category-card">
                    <div class="category-image">
                        <img src="images/gastronomy_gourmet.jpeg" alt="Gastronomy and gourmet">
                    </div>
                    <p class="category-name">Gastronomy and gourmet</p>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
